# Scale fixed 2026-11-14: the select scene units are about 0.44 of a yard (characters stand 1 unit apart), so the inn is scaled to match.
# Room view (manual camera, scene units): looks at the group from the front.

# Preset A (2026-11-14): cast moved to the open spot at inn-local (-8.8, -0.4), floor height 0.44, camera looking along -x.

# Rows run away from the camera (log: slot 4 was at +x, toward the camera).
WOW_INN_CAST_DEPTH_SIGN=-1

# Room view from the front-right corner: best line of sight to all 8 characters (computed against the inn triangles, 14 of 16 rays clear).

# Stage moved to the big upstairs room (inn-local x 0..14, y -10..4, floor 7.5); cast centre at local (7,-3).
# Room view from the room corner, high, 0 of 16 sight lines blocked (computed).

# Camera checked to be INSIDE the room (rays in 26 directions all hit walls), 0 of 16 sight lines blocked: local (12.8, 2.8, 10.4).

# From the owner's .gps in the real inn (X -9458.9 Y 29.23 Z 58.16 Orientation 3.7255): camera there, looking along that heading, 45 degrees down.
# Stage = the floor 5 yd ahead (ground floor main room); camera 5 yd up. Converted with the inn placement (origin -9464.25, 24.40, 56.53, 83 deg).
# Camera raised to just under the ground-floor ceiling (ceiling is at about 5.8 yd local; 2.40 scene = 5.3 yd).

# TEST (no room rotation): same stage and camera spot as the .gps conversion, but the room is only translated, not turned.
# Stage centre inner-local (2.2,-0.92, floor -0.19); camera at your spot (5.45,-4.72, 5.27).

# FIXED (from the v11 log): the backdrop model the room is placed in is itself scaled by 0.451, so room scale/offsets are in that space.
# SCALE 1.0 = true proportion to the characters. Stage = the hall floor 5 yd ahead of the gallery .gps spot; camera = the gallery spot, high, looking down.
